syntax = "proto3";

package authpb;

option go_package = "pb/authpb";

import "google/protobuf/empty.proto"; // ✅ tambahkan ini


message User {
  int32  id = 1;
  string name = 2;
  string email = 3;
  string role = 4;
}

message RegisterRequest {
  string name = 1;
  string email = 2;
  string role = 3;
  string password = 4;
}

message RegisterResponse {
  User user = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  User user = 2;
}

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
}
