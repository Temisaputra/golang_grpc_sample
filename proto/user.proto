syntax = "proto3";

package userpb;

option go_package = "pb/userpb";

import "google/protobuf/empty.proto"; // ✅ tambahkan ini


message User {
  int32  id = 1;
  string name = 2;
  string email = 3;
  string role = 4;
  string password = 5;
}

message CreateUserRequest {
  string name = 1;
  string email = 2;
  string role = 3;
  string password = 4;
}

message CreateUserResponse {
  User user = 1;
}

message GetUserRequest {
  int32  id = 1;
}

message GetUserResponse {
  User user = 1;
}

message GetAllUserResponse {
  repeated User users = 1;
}

message UpdateUserRequest {
  int32 id = 1;
  string name = 2;
  string email = 3;
  string role = 4;
  string password = 5;
}

service UserService {
  rpc CreateUser(CreateUserRequest) returns (google.protobuf.Empty);
  rpc GetUser(GetUserRequest) returns (GetAllUserResponse);
  rpc GetUserById(GetUserRequest) returns (GetUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (google.protobuf.Empty);
  rpc DeleteUser(GetUserRequest) returns (google.protobuf.Empty);
}
