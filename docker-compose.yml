version: "3.8"

services:
  envoy:
    image: envoyproxy/envoy:v1.27.0
    container_name: envoy
    ports:
      - "8081:8081" # untuk gRPC-Web (frontend akses)
      - "9901:9901" # admin interface Envoy
    volumes:
      - ./envoy.yml:/etc/envoy/envoy.yml
    depends_on:
      - grpc-service
    networks:
      - envoy-net

  grpc-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grpc-service
    ports:
      - "50051:50051"
    networks:
      - envoy-net
    env_file:
      - .env

networks:
  envoy-net:
    driver: bridge
